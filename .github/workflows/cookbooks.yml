name: Cookbooks

# Scoped to cookbooks/ on two independent levels, because this repository also
# holds migrations/ and reference-architectures/ and this workflow has nothing to
# say about them.
#
#   1. `paths` below means the workflow does not start at all for a pull request
#      that leaves cookbooks/ alone.
#   2. Every step then addresses cookbooks/ explicitly, so nothing leaks out even
#      if the trigger is widened later.
#
# 🚨 Do not make these jobs *required* status checks while the `paths` filter is
# here. A required check that never runs leaves a pull request waiting forever,
# which is GitHub's oldest sharp edge. Either leave them advisory, or drop the
# filter and let the jobs no-op on their own.
#
# These checks are deliberately shallow. They catch what a contributor cannot
# reasonably be expected to know and what review keeps missing anyway: a link
# that no longer resolves, a file that should never have been committed, code
# that does not lint. Everything about whether a recipe is *good* stays in review,
# where a person can weigh it.

on:
  pull_request:
    branches: [main]
    paths:
      - 'cookbooks/**'
  push:
    branches: [main]
    paths:
      - 'cookbooks/**'

permissions:
  contents: read

jobs:
  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      # ruff reads its configuration from cookbooks/pyproject.toml, which selects
      # E, F, I, UP and B at line-length 88. Linting the whole directory rather
      # than the changed files is the simpler thing and avoids interpolating
      # PR-controlled filenames into a shell command.
      #
      # `ruff format` is deliberately not run. That is a decision recorded in
      # cookbooks/pyproject.toml: recipes align their request blocks by hand so
      # the printed output reads as a table, and the formatter takes that apart.
      # Lint the code, leave the layout alone.
      - name: ruff check
        working-directory: cookbooks
        run: uvx ruff check . --output-format=github

  links:
    name: Relative links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A recipe README links to its own data/ and images/ and to sibling
      # recipes. Those break silently on a rename, and a reader meets a 404
      # rather than a diagnostic — so check them rather than trusting them.
      #
      # Fenced code blocks and inline code spans are both skipped, because both
      # legitimately contain "](" without holding a link. A Python call like
      # TOOL_FUNCTIONS[name](**json.loads(args)) is the fenced case; prose that
      # quotes link syntax inside backticks is the inline one, and a page
      # documenting these very checks trips it. Both were found by running this
      # against the real tree, which is the only way they get found.
      - name: Check every relative Markdown link under cookbooks/
        run: |
          status=0
          while IFS= read -r doc; do
            dir="$(dirname "$doc")"
            targets=$(awk '/^```/ { fence = !fence; next } !fence' "$doc" \
              | sed 's/`[^`]*`//g' \
              | grep -oE '\]\([^)]+\)' \
              | sed 's/^](//; s/)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:|$)' || true)
            while IFS= read -r target; do
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$doc::broken relative link: $target"
                status=1
              fi
            done <<< "$targets"
          done < <(find cookbooks -name '*.md')
          exit $status

      # A re-linking pass once produced [label](target)](target), which stays
      # clickable and renders the duplicate as visible text. Sixteen of them
      # reached main, because the check above cannot see it: both halves point at
      # a target that exists, so every link "resolves".
      #
      # The pattern is ](...)](  rather than a bare )](  so that a link whose text
      # ends in a parenthesis — [Amazon Bedrock (preview)](url) — does not trip it.
      - name: Refuse doubled link suffixes
        run: |
          status=0
          while IFS= read -r doc; do
            hits=$(awk '/^```/ { fence = !fence; next } !fence' "$doc" \
              | sed 's/`[^`]*`//g' \
              | grep -nE '\]\([^)]*\)\]\(' || true)
            if [ -n "$hits" ]; then
              echo "$hits" | while IFS= read -r hit; do
                echo "::error file=$doc::doubled link suffix, the target is repeated: ${hit}"
              done
              status=1
            fi
          done < <(find cookbooks -name '*.md')
          exit $status

  hygiene:
    name: No stray files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These are gitignored in the source repository, so they arrive here only
      # when someone copies a directory rather than using git — which has already
      # happened twice. Cheap to check, and the failure is self-explanatory.
      - name: Refuse OS cruft and build caches
        run: |
          found=$(find cookbooks \
            \( -name '.DS_Store' -o -name '._*' -o -name 'Thumbs.db' \
               -o -name '__pycache__' -o -name '.ruff_cache' -o -name '.venv' \) \
            -print)
          if [ -n "$found" ]; then
            echo "$found" | while IFS= read -r f; do echo "::error file=$f::should not be committed"; done
            exit 1
          fi
          echo "Clean."
