<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Migration from Azure OpenAI to Amazon Bedrock</title>
  <desc id="description">An evidence-driven migration flow with separate source, Codex Desktop, AWS sandbox, and Amazon Bedrock service boundaries, plus explicit approval gates and scope exclusions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .boundary { font: 700 13px Arial, sans-serif; letter-spacing: 1.2px; }
      .heading { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .chip { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .arrow-label { font: 700 13px Arial, sans-serif; fill: #475569; }
      .gate { font: 700 15px Arial, sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .scope-title { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .scope { font: 400 14px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Migration from Azure OpenAI to Amazon Bedrock</text>

  <!-- Source application boundary -->
  <rect x="60" y="130" width="330" height="420" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="60" y="130" width="330" height="48" rx="8" fill="#eff6ff"/>
  <text x="82" y="160" class="boundary" fill="#1d4ed8">SOURCE APPLICATION BOUNDARY</text>
  <text x="82" y="215" class="heading">Azure application source</text>
  <text x="82" y="244" class="body">Repository and observed runtime</text>

  <rect x="82" y="274" width="286" height="60" rx="7" fill="#dbeafe"/>
  <text x="99" y="299" class="chip">Application contracts</text>
  <text x="99" y="320" class="small">APIs, UI journeys, state, and errors</text>

  <rect x="82" y="348" width="286" height="60" rx="7" fill="#dbeafe"/>
  <text x="99" y="373" class="chip">Azure dependencies</text>
  <text x="99" y="394" class="small">Compute, data, identity, and network</text>

  <rect x="82" y="422" width="286" height="78" rx="7" fill="#bfdbfe"/>
  <text x="99" y="447" class="chip">Azure OpenAI</text>
  <text x="99" y="469" class="small">Chat Completions behavior</text>
  <text x="99" y="489" class="small">Deployment-name configuration</text>

  <!-- Evidence flow -->
  <path d="M390 330 H455" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Codex workspace boundary -->
  <rect x="470" y="130" width="500" height="420" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="470" y="130" width="500" height="48" rx="8" fill="#ecfdf5"/>
  <text x="492" y="160" class="boundary" fill="#047857">PARTICIPANT-CONTROLLED LOCAL BOUNDARY</text>
  <text x="492" y="215" class="heading">Codex Desktop migration workspace</text>
  <text x="492" y="244" class="body">Four specialists coordinate through validated artifacts</text>

  <rect x="492" y="274" width="218" height="48" rx="7" fill="#d1fae5"/>
  <text x="510" y="304" class="chip">Migration discovery</text>
  <rect x="730" y="274" width="218" height="48" rx="7" fill="#d1fae5"/>
  <text x="748" y="304" class="chip">Migration architecture</text>
  <rect x="492" y="336" width="218" height="48" rx="7" fill="#d1fae5"/>
  <text x="510" y="366" class="chip">Migration validation</text>
  <rect x="730" y="336" width="218" height="48" rx="7" fill="#d1fae5"/>
  <text x="748" y="366" class="chip">AWS deployment</text>

  <rect x="492" y="404" width="456" height="80" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="510" y="430" class="chip">Decision and delivery artifacts</text>
  <text x="510" y="452" class="small">Source profile, architecture decision, model/API decision,</text>
  <text x="510" y="472" class="small">generated target, validation evidence, deployment manifest</text>

  <text x="492" y="510" class="small">Evidence remains under /tmp/workshop-artifacts.</text>

  <!-- Approved package flow -->
  <path d="M970 330 H1035" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- AWS sandbox boundary -->
  <rect x="1050" y="130" width="330" height="420" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="1050" y="130" width="330" height="48" rx="8" fill="#fffbeb"/>
  <text x="1072" y="160" class="boundary" fill="#b45309">AWS SANDBOX ACCOUNT BOUNDARY</text>
  <text x="1072" y="215" class="heading">Selected AWS workload</text>
  <text x="1072" y="244" class="body">Participant-owned account and Region</text>

  <rect x="1072" y="274" width="286" height="60" rx="7" fill="#fef3c7"/>
  <text x="1089" y="299" class="chip">Application runtime</text>
  <text x="1089" y="320" class="small">Selected evidence-backed archetype</text>

  <rect x="1072" y="348" width="286" height="60" rx="7" fill="#fef3c7"/>
  <text x="1089" y="373" class="chip">Supporting AWS services</text>
  <text x="1089" y="394" class="small">Data, integration, secrets, and IAM</text>

  <rect x="1072" y="422" width="286" height="60" rx="7" fill="#fef3c7"/>
  <text x="1089" y="447" class="chip">Operations</text>
  <text x="1089" y="468" class="small">Health, CloudWatch, rollback, teardown</text>

  <!-- Managed inference service boundary -->
  <rect x="730" y="590" width="650" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="730" y="590" width="190" height="104" rx="8" fill="#f5f3ff"/>
  <text x="825" y="650" text-anchor="middle" class="heading">Amazon Bedrock</text>
  <text x="944" y="623" class="chip">OpenAI-compatible Responses API</text>
  <text x="944" y="648" class="body">Exact approved GPT-5.4 or GPT-5.5 model and Region</text>
  <text x="944" y="674" class="small">Full inference URL is validated; silent fallback is prohibited.</text>

  <path d="M1215 550 V584" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1227" y="574" class="arrow-label">RESPONSES</text>
  <path d="M700 550 V642 H726" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>

  <!-- Human approval gates -->
  <text x="60" y="610" class="boundary" fill="#475569">HUMAN APPROVAL GATES</text>
  <rect x="60" y="632" width="196" height="42" rx="7" fill="#4f46e5"/>
  <text x="78" y="658" class="gate">APPROVE MIGRATION</text>
  <text x="60" y="697" class="small">Target generation</text>

  <rect x="278" y="632" width="104" height="42" rx="7" fill="#b45309"/>
  <text x="300" y="658" class="gate">DEPLOY</text>
  <text x="278" y="697" class="small">AWS resources</text>

  <rect x="404" y="632" width="112" height="42" rx="7" fill="#b91c1c"/>
  <text x="420" y="658" class="gate">DESTROY</text>
  <text x="404" y="697" class="small">Recorded cleanup</text>

  <!-- Scope boundary -->
  <rect x="60" y="738" width="1320" height="94" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="82" y="770" class="scope-title">Migration scope</text>
  <text x="82" y="798" class="scope">In scope: application discovery, behavior-preserving changes, target code, AWS infrastructure, schemas, and sandbox seed data.</text>
  <text x="82" y="824" class="scope">Control: evidence-backed decisions, least-privilege deployment, observable validation, rollback readiness, and verified teardown.</text>
</svg>
